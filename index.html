<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <main>

      <!-- Balance Display -->
      <section id="balance-section" aria-labelledby="app-heading">
        <h1 id="app-heading">Expense &amp; Budget Visualizer</h1>
        <div class="balance-card">
          <p class="balance-label">Total Spent</p>
          <p class="balance-value">
            <span id="balance-amount">0.00</span>
            <span id="balance-overflow" class="overflow-indicator" hidden>⚠ Display limit reached</span>
          </p>
        </div>
      </section>

      <!-- Input Form -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Expense</h2>
        <form id="expense-form" novalidate>

          <div class="form-field">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              placeholder="Item name"
              autocomplete="off"
              aria-describedby="error-name"
            >
            <span class="field-error" id="error-name" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="item-amount">Amount</label>
            <input
              type="number"
              id="item-amount"
              name="item-amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
              aria-describedby="error-amount"
            >
            <span class="field-error" id="error-amount" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="item-category">Category</label>
            <select
              id="item-category"
              name="item-category"
              aria-describedby="error-category"
            >
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="field-error" id="error-category" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn-submit">Add Transaction</button>

        </form>
      </section>

      <!-- Transaction List -->
      <section id="transaction-section" aria-labelledby="transaction-heading">
        <h2 id="transaction-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction history"></ul>
        <p id="transaction-empty" class="empty-state">No transactions recorded yet.</p>
      </section>

      <!-- Pie Chart -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <canvas id="spending-chart" role="img" aria-label="Spending distribution pie chart"></canvas>
        <p id="chart-empty" class="empty-state">No data available.</p>
        <p id="chart-error" class="chart-error" hidden>Chart could not be loaded.</p>
      </section>

    </main>
  </div>

  <!-- Chart.js must load before app.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
